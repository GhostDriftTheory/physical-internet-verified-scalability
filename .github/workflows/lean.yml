name: Lean verification

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and independent verification
        uses: leanprover/lean-action@v1.5.0
        with:
          auto-config: false
          build: true
          test: false
          lint: false
          use-mathlib-cache: false
          build-args: "--wfail"

      - name: Directly compile core
        run: lake env lean PhysicalInternetVerifiedScalability.lean

      - name: Audit theorem axioms
        run: lake env lean AxiomAudit.lean

      - name: Reject placeholders and malformed escapes
        shell: bash
        run: |
          if grep -RInE '(^|[[:space:]])(sorry|admit)([[:space:]]|$)|^[[:space:]]*(axiom|unsafe)\b' --include='*.lean' .; then
            exit 1
          fi

          if grep -RIn '\\_' --include='*.lean' .; then
            exit 1
          fi

          if grep -RIn '\\\*' --include='*.lean' .; then
            exit 1
          fi
